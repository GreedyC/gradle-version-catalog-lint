[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradle-catalog-lint"
dynamic = ["version"]
description = "Fast, zero-dependency linter for Gradle version catalogs (libs.versions.toml): unused libraries, plugins and versions, dynamic/SNAPSHOT versions, hard-coded dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Arslan", email = "cosmichackerx@users.noreply.github.com" }]
keywords = ["gradle", "version-catalog", "libs.versions.toml", "android", "kotlin", "lint", "dependencies", "ci", "sarif", "dependency-management"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/cosmichackerx/gradle-version-catalog-lint"
Issues = "https://github.com/cosmichackerx/gradle-version-catalog-lint/issues"
Changelog = "https://github.com/cosmichackerx/gradle-version-catalog-lint/blob/main/CHANGELOG.md"

[project.scripts]
catalog-lint = "catalog_lint.cli:main"
gradle-catalog-lint = "catalog_lint.cli:main"

[tool.setuptools.dynamic]
version = { attr = "catalog_lint.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
